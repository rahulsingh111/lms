{% extends "/shared/admin_layout.html" %}
{% block title %}Add Book — Libra{% endblock %}
{% block content %}<div class="form-page"><a class="back-link" href="/admin/books/"><i class="bi bi-arrow-left"></i> Back to books</a><div class="form-card"><span class="eyebrow">CATALOG</span><h1>Add a new book</h1><p>Add a title to your library collection.</p>{% if error %}<div class="flash-error"><i class="bi bi-exclamation-circle"></i>{{error}}</div>{% endif %}<form action="/admin/books/add" method="POST"><div class="form-grid"><label>Title<input type="text" name="title" required placeholder="Book title"></label><label>Author<input type="text" name="author" placeholder="Author name"></label></div><div class="form-grid"><label>Edition<input type="text" name="edition" value="1"></label><label>Quantity<input type="number" name="qty" min="0" value="1" required></label></div><label>Description<textarea name="desc" rows="5" placeholder="Short description"></textarea></label><label class="check-row"><input type="checkbox" name="available"> <span>Make this book visible to members</span></label><button class="primary-btn" type="submit">Add book <i class="bi bi-plus-lg"></i></button></form></div></div>{% endblock %}
