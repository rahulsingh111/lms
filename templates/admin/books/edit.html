{% extends "/shared/admin_layout.html" %}
{% block title %}Edit {{book['name']}} — Libra{% endblock %}
{% block content %}<div class="form-page"><a class="back-link" href="/admin/books/"><i class="bi bi-arrow-left"></i> Back to books</a><div class="form-card"><span class="eyebrow">CATALOG</span><h1>Edit book</h1><p>Update <strong>{{book['name']}}</strong>.</p><form action="/admin/books/edit/{{book['id']}}" method="POST"><div class="form-grid"><label>Title<input type="text" name="title" value="{{book['name']}}" required></label><label>Author<input type="text" name="author" value="{{book['author']}}"></label></div><div class="form-grid"><label>Edition<input type="text" name="edition" value="{{book['edition']}}"></label><label>Quantity<input type="number" name="qty" min="0" value="{{book['count']}}" required></label></div><label>Description<textarea name="desc" rows="5">{{book['desc']}}</textarea></label><label class="check-row"><input type="checkbox" name="available" {{'checked' if book['availability']==1 else ''}}> <span>Make this book visible to members</span></label><button class="primary-btn" type="submit">Save changes <i class="bi bi-check2"></i></button></form></div></div>{% endblock %}
