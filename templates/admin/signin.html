{% extends "/shared/admin_layout.html" %}
{% block title %}Admin Sign in — Libra{% endblock %}
{% block content %}<div class="auth-page"><div class="auth-card"><div class="auth-brand"><span class="brand-mark"><i class="bi bi-shield-lock"></i></span><span>Administration</span></div><h1>Admin sign in</h1><p class="auth-subtitle">Access the Libra control center.</p>{% if error %}<div class="flash-error"><i class="bi bi-exclamation-circle"></i>{{error}}</div>{% endif %}<form action="/admin/signin/" method="POST"><label>Email address<input type="email" name="email" required placeholder="admin@example.com"></label><label>Password<input type="password" name="password" required placeholder="Password"></label><button class="primary-btn" type="submit">Enter dashboard <i class="bi bi-arrow-right"></i></button></form></div></div>{% endblock %}
