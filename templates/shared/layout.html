<!doctype html>
<html lang="en">
<head>
  {% block head %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Library Management System{% endblock %}</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style.css">
  {% endblock %}
</head>
<body class="app-body {{ 'home-page' if g and g.bg==1 else '' }}">
  <nav class="topbar">
    <div class="nav-shell">
      <a class="brand" href="/">
        <span class="brand-mark"><i class="bi bi-book-half"></i></span>
        <span><strong>Libra</strong><small>LMS</small></span>
      </a>
      <div class="nav-links">
        <a class="nav-link {{ 'active' if request.path == '/' else '' }}" href="/"><i class="bi bi-grid-1x2"></i> Home</a>
        <a class="nav-link {{ 'active' if request.path.startswith('/books') else '' }}" href="/books/"><i class="bi bi-collection"></i> Explore</a>
        {% if g and g.user %}
          <a class="nav-link {{ 'active' if request.path.startswith('/user') else '' }}" href="/user/"><i class="bi bi-person-circle"></i> Profile</a>
          <a class="nav-cta" href="/signout/"><i class="bi bi-box-arrow-right"></i> Sign out</a>
        {% else %}
          <a class="nav-link" href="/signin"><i class="bi bi-box-arrow-in-right"></i> Sign in</a>
          <a class="nav-cta" href="/signup">Get started</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div><span class="brand-dot"></span> Libra Library Management System</div>
    <div>Discover · Reserve · Read</div>
  </footer>
</body>
</html>
