{% extends "/shared/layout.html" %}
{% block title %}Sign in — Libra{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card"><div class="auth-brand"><span class="brand-mark"><i class="bi bi-book-half"></i></span><span>Welcome back</span></div><h1>Sign in to Libra</h1><p class="auth-subtitle">Continue your reading journey.</p>{% if error %}<div class="flash-error"><i class="bi bi-exclamation-circle"></i>{{error}}</div>{% endif %}<form action="/signin" method="POST"><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label><button class="primary-btn" type="submit">Sign in <i class="bi bi-arrow-right"></i></button></form><p class="auth-footer">New to Libra? <a href="/signup">Create an account</a></p></div></div>
{% endblock %}
